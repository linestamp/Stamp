<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>スタンプが届きました</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg: #eceeef;
    --card: #ffffff;
    --ink: #1a1c1e;
    --ink-soft: #5b6267;
    --line: #d9dcdf;
    --accent: #2f5fa8;
    --accent-ink: #1d3f73;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    background:var(--bg);
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding: max(28px, env(safe-area-inset-top)) 16px 48px;
    line-height:1.7;
  }
  .wrap{ width:100%; max-width:420px; }

  h1.page-title{
    font-size:14px;
    font-weight:700;
    color:var(--ink-soft);
    margin:0 0 12px;
    letter-spacing:.02em;
  }

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:8px;
    padding:24px;
  }

  label{
    display:block;
    font-size:13px;
    font-weight:700;
    color:var(--ink-soft);
    margin:16px 0 6px;
  }
  label:first-of-type{ margin-top:0; }
  .field-row{ display:flex; gap:10px; align-items:center; }
  .field-row input[type=number]{ width:90px; flex:none; }
  .field-row span{ font-size:13px; color:var(--ink-soft); }

  input[type=text], input[type=number], input[type=url]{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:6px;
    font-size:14px;
    font-family:inherit;
    background:#fff;
    color:var(--ink);
    letter-spacing:.02em;
  }
  input:focus{ outline:2px solid var(--accent); outline-offset:1px; }

  .img-drop{
    border:1px dashed var(--line);
    border-radius:6px;
    padding:16px;
    text-align:center;
    color:var(--ink-soft);
    font-size:13px;
    cursor:pointer;
    background:#fafafa;
  }
  .img-drop img{ max-width:110px; max-height:110px; border-radius:4px; display:block; margin:0 auto 8px; object-fit:contain; }
  input[type=file]{ display:none; }

  button{ font-family:inherit; cursor:pointer; border:none; }
  .btn-main{
    width:100%;
    margin-top:22px;
    padding:12px;
    border-radius:6px;
    background:var(--accent);
    color:#fff;
    font-weight:700;
    font-size:14px;
  }
  .btn-main:hover{ background:var(--accent-ink); }
  .btn-main:disabled{ opacity:.5; cursor:default; }

  .progress-note{ font-size:12px; color:var(--ink-soft); margin-top:8px; display:none; }
  .progress-note.show{ display:block; }

  .result{
    margin-top:18px;
    padding:14px;
    border-radius:6px;
    background:#eef3ec;
    border:1px solid #9fc19a;
    display:none;
  }
  .result.show{ display:block; }
  .result p{ margin:0 0 8px; font-size:13px; color:var(--ink-soft); }
  .code-display{
    font-size:24px; font-weight:700; letter-spacing:.1em;
    text-align:center; padding:10px; background:#fff; border:1px solid var(--line);
    border-radius:6px; margin-bottom:12px;
  }
  textarea{
    width:100%; min-height:90px; resize:vertical;
    padding:10px 12px; border:1px solid var(--line); border-radius:6px;
    font-size:13px; font-family:inherit; background:#fff; color:var(--ink);
  }
  .copy-row{ display:flex; gap:8px; margin-top:8px; }
  .copy-row button{
    padding:8px 14px; border-radius:6px; background:var(--accent); color:#fff;
    font-weight:700; font-size:13px; white-space:nowrap;
  }
  .hint{ font-size:12px; color:var(--ink-soft); margin-top:10px; line-height:1.6; }
  .error{
    font-size:13px; font-weight:700; margin-top:10px;
    color:#9a2d2d; background:#fbe9e9; border:1px solid #e3a0a0;
    border-radius:6px; padding:10px 12px; display:none;
  }
  .error.show{ display:block; }

  .stage{ text-align:left; }

  .sent-line{
    font-size:14px; font-weight:700; color:var(--ink);
    margin-bottom:16px; line-height:1.6;
  }

  .image-box{
    width:160px; height:160px; margin:0 auto 18px; border-radius:6px;
    background:#fafafa; border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    color:var(--ink-soft); font-size:12px;
  }
  .image-box img{ width:100%; height:100%; object-fit:contain; display:none; }
  .image-box.unlocked img{ display:block; }

  .stamp-title{
    font-size:24px; font-weight:700; margin-bottom:4px; text-align:center;
  }
  .detail-link-wrap{
    text-align:center;
    margin-bottom:14px;
  }
  .detail-link{
    display:inline-block;
    font-size:13px;
    color:var(--accent);
    text-decoration:underline;
    font-weight:500;
  }
  .detail-link:hover{ color:var(--accent-ink); }

  .coin-row{
    display:block; text-align:center;
    background:#f3f3f3; color:var(--ink);
    padding:6px 10px; border-radius:4px; font-weight:700; font-size:14px; margin:0 0 18px;
  }
  .meta-table{ font-size:13px; color:var(--ink-soft); line-height:2; }
  .meta-table b{ color:var(--ink); font-weight:700; }

  .back-link{
    display:inline-block; margin-top:16px; font-size:12px; color:var(--ink-soft);
    text-decoration:underline; cursor:pointer; background:none; border:none; padding:0;
  }

  /* 目立たない隠しボタン */
  .secret-spot{
    display:block;
    text-align:center;
    margin-top:28px;
    font-size:11px;
    color:#c7cbcd;
    cursor:default;
    user-select:none;
    background:none; border:none; width:100%; padding:6px 0;
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- ================= コード入力画面 ================= -->
  <div id="entry">
    <h1 class="page-title">LINEスタンプ受け取りコード入力</h1>
    <div class="card">
      <label for="e-code">受け取りコード</label>
      <input id="e-code" type="text" placeholder="受け取りコードを入力" maxlength="12" autocomplete="off">

      <button class="btn-main" id="btn-check">確認する</button>
      <div class="progress-note" id="entry-progress">確認しています…</div>
      <div class="error" id="entry-error"></div>

      <button class="secret-spot" id="secret-btn" type="button">・</button>
    </div>
  </div>

  <!-- ================= 作成画面(隠し) ================= -->
  <div id="creator" style="display:none;">
    <h1 class="page-title">コードの発行</h1>
    <div class="card">
      <label for="f-from">送信者の名前</label>
      <input id="f-from" type="text" placeholder="例" maxlength="30">

      <label for="f-name">スタンプの名前</label>
      <input id="f-name" type="text" placeholder="例：おめでとうスタンプ" maxlength="40">

      <label for="f-detail-url">「スタンプの詳細」のリンク先URL（任意）</label>
      <input id="f-detail-url" type="url" placeholder="例：https://example.com">

      <label for="f-coin">コイン数</label>
      <input id="f-coin" type="number" placeholder="例：120" min="0">

      <label for="f-to">宛名（受け取る人の名前）</label>
      <input id="f-to" type="text" placeholder="例：たろう" maxlength="30">

      <label for="f-time">受け取り期限</label>
      <div class="field-row">
        <input id="f-time" type="number" min="0" max="365" value="1">
        <span>日以内</span>
      </div>

      <label>スタンプ画像</label>
      <div class="img-drop" id="drop">
        <span id="drop-label">タップして画像を選択（自動で軽量化されます）</span>
        <input type="file" id="f-image" accept="image/*">
      </div>

      <button class="btn-main" id="btn-create">コードを発行する</button>
      <div class="progress-note" id="create-progress">保存しています…</div>
      <div class="error" id="create-error"></div>

      <div class="result" id="result">
        <p>発行されたコードです。</p>
        <div class="code-display" id="result-code"></div>

        <p>送信用のテンプレート文（コピーしてそのまま送れます）</p>
        <textarea id="result-template" readonly></textarea>
        <div class="copy-row">
          <button id="btn-copy-code">コードをコピー</button>
          <button id="btn-copy-template">文章をコピー</button>
        </div>
        <div class="hint">このページのURLをまだ知らない相手には、テンプレート文の中のURLも一緒に送ってください。</div>
      </div>

      <button class="back-link" id="btn-back">コード入力画面に戻る</button>
    </div>
  </div>

  <!-- ================= 受け取り(表示)画面 ================= -->
  <div id="viewer" style="display:none;">
    <h1 class="page-title">スタンプの受け取り</h1>
    <div class="card">
      <div id="v-content" class="stage">
        <div class="sent-line" id="v-sent-line"></div>

        <div class="image-box unlocked" id="v-image-box">
          <img id="v-image">
        </div>

        <div class="stamp-title" id="v-name"></div>
        <div class="detail-link-wrap" id="v-detail-wrap" style="display:none;">
          <a class="detail-link" id="v-detail-link" href="#" target="_blank" rel="noopener noreferrer">スタンプの詳細</a>
        </div>

        <div class="coin-row">コイン：<span id="v-coin"></span></div>

        <div class="meta-table">
          <div>送信者：<b id="v-from"></b></div>
          <div>宛先：<b id="v-to"></b></div>
          <div>受け取りまで：<b id="v-days"></b></div>
        </div>
      </div>

      <button class="back-link" id="btn-back2">別のコードを試す</button>
    </div>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  doc,
  setDoc,
  getDoc,
  getDocFromServer,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBX1ytdufTmbCtNiyLxrpzrreYwsgNNhRA",
  authDomain: "sinzobord.firebaseapp.com",
  projectId: "sinzobord",
  storageBucket: "sinzobord.firebasestorage.app",
  messagingSenderId: "326229251487",
  appId: "1:326229251487:web:d5a32cb2a9023d862819aa",
  measurementId: "G-12GGPD0H2H"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const COLLECTION = "jokeStamps";
const MAX_IMAGE_DIMENSION = 480;
const MAX_BASE64_BYTES = 700000;

const entryEl = document.getElementById("entry");
const creatorEl = document.getElementById("creator");
const viewerEl = document.getElementById("viewer");

// 10回連打の判定処理
let secretClickCount = 0;
let secretTimer = null;

document.getElementById("secret-btn").addEventListener("click", () => {
  secretClickCount++;
  clearTimeout(secretTimer);

  if (secretClickCount >= 10) {
    secretClickCount = 0;
    entryEl.style.display = "none";
    creatorEl.style.display = "block";
    return;
  }

  // 1秒以内に次のタップがないとカウントをリセット
  secretTimer = setTimeout(() => {
    secretClickCount = 0;
  }, 1000);
});

document.getElementById("btn-back").addEventListener("click", () => {
  creatorEl.style.display = "none";
  entryEl.style.display = "block";
  secretClickCount = 0;
});
document.getElementById("btn-back2").addEventListener("click", () => {
  viewerEl.style.display = "none";
  entryEl.style.display = "block";
  document.getElementById("e-code").value = "";
  secretClickCount = 0;
});

// ---------------- コード入力 ----------------
const codeInput = document.getElementById("e-code");
const entryError = document.getElementById("entry-error");
const entryProgress = document.getElementById("entry-progress");

document.getElementById("btn-check").addEventListener("click", async () => {
  showEntryError("");
  const code = codeInput.value.trim();
  if (!code) {
    showEntryError("コードを入力してください。");
    return;
  }
  entryProgress.classList.add("show");
  try {
    let snap;
    try {
      snap = await getDocFromServer(doc(db, COLLECTION, code));
    } catch {
      snap = await getDoc(doc(db, COLLECTION, code));
    }
    if (!snap.exists()) {
      showEntryError("そのコードは見つかりませんでした。");
      return;
    }
    showStamp(snap.data());
  } catch (e) {
    console.error(e);
    showEntryError("確認に失敗しました。通信環境を確認してもう一度お試しください。");
  } finally {
    entryProgress.classList.remove("show");
  }
});

function showEntryError(msg){
  entryError.textContent = msg;
  entryError.classList.toggle("show", !!msg);
}

// ---------------- 作成画面 ----------------
(function initCreator(){
  const fFrom = document.getElementById("f-from");
  const fName = document.getElementById("f-name");
  const fDetailUrl = document.getElementById("f-detail-url");
  const fCoin = document.getElementById("f-coin");
  const fTo   = document.getElementById("f-to");
  const fTime = document.getElementById("f-time");
  const fImage = document.getElementById("f-image");
  const dropLabel = document.getElementById("drop-label");
  const drop = document.getElementById("drop");
  const btn = document.getElementById("btn-create");
  const errBox = document.getElementById("create-error");
  const progressNote = document.getElementById("create-progress");
  const resultBox = document.getElementById("result");
  const resultCode = document.getElementById("result-code");
  const resultTemplate = document.getElementById("result-template");

  let base64Image = "";

  drop.addEventListener("click", () => fImage.click());
  fImage.addEventListener("change", () => {
    const file = fImage.files[0];
    if (!file) return;
    showError("");
    resizeImageToBase64(file, MAX_IMAGE_DIMENSION)
      .then((dataUrl) => {
        if (dataUrl.length > MAX_BASE64_BYTES) {
          showError("画像が大きすぎます。もう少し小さい画像を選んでください。");
          base64Image = "";
          dropLabel.innerHTML = "タップして画像を選択（自動で軽量化されます）";
          return;
        }
        base64Image = dataUrl;
        dropLabel.innerHTML = `<img src="${base64Image}">選択済み：${file.name}`;
      })
      .catch((e) => {
        console.error(e);
        showError("画像の読み込みに失敗しました。別の画像でお試しください。");
      });
  });

  btn.addEventListener("click", async () => {
    showError("");
    const from = fFrom.value.trim();
    const name = fName.value.trim();
    const detailUrl = fDetailUrl.value.trim();
    const coin = Number(fCoin.value || 0);
    const to = fTo.value.trim();
    const days = Math.max(0, Math.min(365, Number(fTime.value || 0)));

    if (!from || !name || !to || !base64Image) {
      showError("送信者の名前・スタンプ名・宛名・画像は必須です。");
      return;
    }

    if (detailUrl && !/^https?:\/\//i.test(detailUrl)) {
      showError("リンク先URLは http:// または https:// から始まる形式で入力してください。");
      return;
    }

    btn.disabled = true;
    btn.textContent = "作成中…";
    progressNote.classList.add("show");
    progressNote.textContent = "コードを生成しています…";

    try {
      const code = String(Math.floor(100000 + Math.random() * 900000));
      
      progressNote.textContent = "保存しています…";

      const nowMs = Date.now();
      const docRef = doc(db, COLLECTION, code);
      
      await setDoc(docRef, {
        from, name, detailUrl, coin, to,
        waitDays: days,
        createdAtMs: nowMs,
        image: base64Image,
        createdAt: serverTimestamp()
      });

      const baseUrl = `${location.origin}${location.pathname}`;
      resultCode.textContent = code;
      resultTemplate.value =
`${from}さんからLINEスタンプのプレゼントが届きました！
下のURLを開いて、コードを入力して受け取ってください。
URL：${baseUrl}
コード：${code}`;
      resultBox.classList.add("show");
    } catch (e) {
      console.error(e);
      showError(describeError(e));
    } finally {
      btn.disabled = false;
      btn.textContent = "コードを発行する";
      progressNote.classList.remove("show");
    }
  });

  document.getElementById("btn-copy-code").addEventListener("click", () => {
    navigator.clipboard?.writeText(resultCode.textContent).catch(()=>{});
    flashCopied("btn-copy-code");
  });
  document.getElementById("btn-copy-template").addEventListener("click", () => {
    navigator.clipboard?.writeText(resultTemplate.value).catch(()=>{});
    flashCopied("btn-copy-template");
  });

  function flashCopied(id){
    const b = document.getElementById(id);
    const original = b.textContent;
    b.textContent = "コピーしました";
    setTimeout(() => { b.textContent = original; }, 1500);
  }

  function showError(msg){
    errBox.textContent = msg;
    errBox.classList.toggle("show", !!msg);
  }
})();

function describeError(e){
  const code = e?.code || "";
  if (code.includes("permission-denied")) {
    return "保存できませんでした（権限エラー）。Firestoreのセキュリティルールで書き込みが許可されているか確認してください。";
  }
  if (code.includes("unavailable")) {
    return "サーバーに接続できませんでした。通信環境を確認してもう一度お試しください。";
  }
  return "保存に失敗しました。通信環境を確認してもう一度お試しください。";
}

function resizeImageToBase64(file, maxDim){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onerror = () => reject(reader.error);
    reader.onload = () => {
      img.onerror = () => reject(new Error("image load error"));
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          if (width >= height) {
            height = Math.round(height * (maxDim / width));
            width = maxDim;
          } else {
            width = Math.round(width * (maxDim / height));
            height = maxDim;
          }
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", 0.85));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

// ---------------- 受け取り(表示)画面 ----------------
function showStamp(data){
  entryEl.style.display = "none";
  viewerEl.style.display = "block";

  const from = data.from || "匿名";
  const to = data.to || "匿名";

  document.getElementById("v-sent-line").textContent = `${from}さんから${to}さんにスタンプが送られました`;
  document.getElementById("v-image").src = data.image || "";
  document.getElementById("v-name").textContent = data.name || "(名称未設定)";

  const detailWrap = document.getElementById("v-detail-wrap");
  const detailLink = document.getElementById("v-detail-link");
  if (data.detailUrl && /^https?:\/\//i.test(data.detailUrl)) {
    detailLink.href = data.detailUrl;
    detailWrap.style.display = "block";
  } else {
    detailWrap.style.display = "none";
    detailLink.removeAttribute("href");
  }

  document.getElementById("v-coin").textContent = `${data.coin ?? 0} コイン`;
  document.getElementById("v-from").textContent = from;
  document.getElementById("v-to").textContent = to;
  document.getElementById("v-days").textContent = `${data.waitDays ?? 0}日`;
}
</script>
</body>
</html>
